<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gift Card Balance (CURL Wrapper)</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>Check Balance</h1>
        <p>Backend CURL API execution wrapper</p>
        
        <form id="balanceForm">
            <div class="input-group">
                <label for="cardNumber">Card Number:</label>
                <input type="text" id="cardNumber" placeholder="Enter Card Number" required>
            </div>
            <div class="input-group">
                <label for="pin">PIN:</label>
                <input type="password" id="pin" placeholder="Enter PIN" required>
            </div>
            <button type="submit" id="submitBtn">Check Balance</button>
        </form>
        
        <div id="loading" class="hidden">Executing CURL command...</div>
        <div id="error" class="hidden error"></div>
        <div id="result" class="hidden"></div>
    </div>
    
    <script src="script.js"></script>
</body>
</html>
